# Dedicated shuttle.syndrid.com vhost; does not alter other Syndrid sites.
server {
    listen 80;
    listen [::]:80;
    server_name shuttle.syndrid.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shuttle.syndrid.com;

    ssl_certificate /etc/letsencrypt/live/shuttle.syndrid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shuttle.syndrid.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/shuttle.syndrid.com;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Never cache GPS status responses in the browser or Cloudflare.
    location = /api/v1/vehicles {
        limit_except GET { deny all; }
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8766/v1/vehicles;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /api/ { return 404; }
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
