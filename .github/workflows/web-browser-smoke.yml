name: Shuttle browser smoke

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04 # Playwright 1.57 does not support Ubuntu 26.04 yet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Serve web app locally
        run: |
          python -m http.server 9000 --directory apps/web > /tmp/ccny-shuttle-server.log 2>&1 &
      - name: Check map, GPS state, stop tabs, and mobile layout
        env:
          SHUTTLE_SITE_URL: http://127.0.0.1:9000/
        run: python apps/web/tests/browser_smoke.py
      - name: Verify bus shortcuts, geometry, and popup on phone widths
        env:
          SHUTTLE_SITE_URL: http://127.0.0.1:9000/
        run: python apps/web/tests/browser_mobile_visibility.py
      - name: Check automatically visible last GPS positions and offline recovery
        env:
          SHUTTLE_SITE_URL: http://127.0.0.1:9000/
        run: python apps/web/tests/browser_last_known.py
      - name: Verify northbound/southbound routes and moving bus heading arrows
        env:
          SHUTTLE_SITE_URL: http://127.0.0.1:9000/
        run: python apps/web/tests/browser_route_overlay.py
      - name: Verify quiet one-screen layout at desktop and phone widths
        env:
          SHUTTLE_SITE_URL: http://127.0.0.1:9000/
        run: python apps/web/tests/browser_compact_cleanup.py
      - name: Verify date-aware academic service notifications with fixed clock
        env:
          SHUTTLE_SITE_URL: http://127.0.0.1:9000/
        run: python apps/web/tests/browser_service_notice.py
