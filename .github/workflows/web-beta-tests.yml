name: Shuttle web beta tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/shuttle-web-mvp

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify HTML, assets, data integrity and status API contract
        run: node --test apps/web/tests/*.test.mjs
